<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Where is flower?</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: #fbe7f8;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .game {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px 20px;
        }


        /* =========================
           QUESTION
        ========================= */

        .question {
            margin: 0 0 60px 0;

            font-size: clamp(34px, 6vw, 64px);
            font-weight: 400;

            line-height: 1.2;

            color: #111;

            text-align: center;
        }


        /* =========================
           OPTIONS
        ========================= */

        .options {
            width: 100%;

            display: flex;

            justify-content: center;
            align-items: flex-start;

            gap: clamp(40px, 10vw, 160px);
        }


        /* =========================
           OPTION
        ========================= */

        .option {
            width: min(38vw, 360px);

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;
        }


        /* =========================
           IMAGE
        ========================= */

        .picture {
            width: 100%;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            display: block;

            border: 4px solid #ffffff;

            box-shadow:
                0 0 3px rgba(0, 0, 0, 0.25);

            user-select: none;

            -webkit-user-drag: none;

            pointer-events: none;

            /*
             * Starting state for fade-in
             */
            opacity: 0;

            transform: translateY(10px);

            animation: imageFadeIn 1s ease forwards;
        }


        /* Left image slightly earlier */

        .option:first-child .picture {
            animation-delay: 0.15s;
        }


        /* Right image slightly later */

        .option:last-child .picture {
            animation-delay: 0.30s;
        }


        /* =========================
           IMAGE FADE-IN ANIMATION
        ========================= */

        @keyframes imageFadeIn {

            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           CIRCLE
        ========================= */

        .circle {
            width: 70px;
            height: 70px;

            margin-top: 25px;

            padding: 0;

            border: 3px solid #333;

            border-radius: 50%;

            background: transparent;

            display: flex;

            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 40px;
            font-weight: 400;

            line-height: 1;

            color: #111;

            cursor: pointer;

            outline: none;

            transition:
                transform 0.15s ease,
                border-color 0.2s ease,
                color 0.2s ease;
        }


        /* Button press */

        .circle:active {
            transform: scale(0.88);
        }


        /* =========================
           WRONG
        ========================= */

        .circle.wrong {
            border-color: #e53935;

            color: #e53935;

            animation: shake 0.45s ease;
        }


        /* =========================
           CORRECT
        ========================= */

        .circle.correct {
            border-color: #18a558;

            color: #18a558;

            animation: correctPop 0.45s ease;
        }


        /* =========================
           WRONG ANIMATION
        ========================= */

        @keyframes shake {

            0% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-9px);
            }

            40% {
                transform: translateX(9px);
            }

            60% {
                transform: translateX(-7px);
            }

            80% {
                transform: translateX(7px);
            }

            100% {
                transform: translateX(0);
            }
        }


        /* =========================
           CORRECT ANIMATION
        ========================= */

        @keyframes correctPop {

            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            60% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .game {
                width: 100%;
                height: 100vh;

                padding: 25px 15px;

                justify-content: center;
                align-items: center;
            }


            .question {
                margin-bottom: 45px;

                font-size: clamp(30px, 9vw, 48px);
            }


            .options {
                width: 100%;

                justify-content: center;
                align-items: flex-start;

                gap: 20px;
            }


            .option {
                width: 44%;
            }


            .picture {
                width: 100%;

                border-width: 3px;
            }


            .circle {
                width: 60px;
                height: 60px;

                margin-top: 20px;

                font-size: 34px;

                border-width: 2px;
            }
        }


        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 380px) {

            .game {
                padding-left: 10px;
                padding-right: 10px;
            }


            .question {
                margin-bottom: 35px;

                font-size: 30px;
            }


            .options {
                gap: 14px;
            }


            .option {
                width: 45%;
            }


            .circle {
                width: 54px;
                height: 54px;

                margin-top: 17px;

                font-size: 30px;
            }
        }

    </style>
</head>


<body>


    <main class="game">


        <!-- QUESTION -->

        <h1 class="question">
            Where is flower?
        </h1>


        <!-- OPTIONS -->

        <div class="options">


           <!-- LEFT / CORRECT -->

<div class="option">

    <img
        src="flower1.jpg"
        alt="Option 1"
        class="picture"
    >

    <button
        id="wrongButton"
        class="circle"
        type="button"
        aria-label="Correct answer"
        onclick="correctAnswer()">
    </button>

</div>


<!-- RIGHT / WRONG -->

<div class="option">

    <img
        src="flower2.jpg"
        alt="Option 2"
        class="picture"
    >

    <button
        id="correctButton"
        class="circle"
        type="button"
        aria-label="Wrong answer"
        onclick="wrongAnswer()">
    </button>

</div>


        </div>

    </main>


    <!-- =========================
         AUDIO
    ========================== -->

    <audio
        id="wrongSound"
        src="wrong.mp3"
        preload="auto">
    </audio>


    <audio
        id="rightSound"
        src="right.mp3"
        preload="auto">
    </audio>



    <script>

    /* =========================
       LEFT CIRCLE = CORRECT
    ========================= */

    function correctAnswer() {

        const button =
            document.getElementById("wrongButton");

        const sound =
            document.getElementById("rightSound");


        /* Play right sound */

        sound.pause();
        sound.currentTime = 0;

        sound.play().catch(function(error) {

            console.log(
                "Right sound could not play:",
                error
            );

        });


        /* Show RIGHT tick */

        button.innerHTML = "✓";

        button.classList.remove("wrong");

        void button.offsetWidth;

        button.classList.add("correct");


        /* Disable both buttons */

        document.getElementById(
            "wrongButton"
        ).disabled = true;

        document.getElementById(
            "correctButton"
        ).disabled = true;


        /*
         * Correct answer ke baad
         * index2.html open hoga.
         */

        setTimeout(function() {
    window.location.replace("index3.html");
}, 1000);

    }



    /* =========================
       RIGHT CIRCLE = WRONG
    ========================= */

    function wrongAnswer() {

        const button =
            document.getElementById("correctButton");

        const sound =
            document.getElementById("wrongSound");


        /* Play wrong sound */

        sound.pause();
        sound.currentTime = 0;

        sound.play().catch(function(error) {

            console.log(
                "Wrong sound could not play:",
                error
            );

        });


        /* Show WRONG tick */

        button.innerHTML = "✕";

        button.classList.remove("correct");

        void button.offsetWidth;

        button.classList.add("wrong");

    }

</script>


</body>
</html>
